<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1a12">
<title>Terrazas Alcorcón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#0d1a12;--bg2:#111f16;--bg3:#162318;--surface:#1a2d1e;--surface2:#1f3523;
  --border:rgba(180,210,150,.1);--border2:rgba(180,210,150,.18);
  --gold:#c8a96e;--gold2:#e8c98e;--green:#4caf50;--green2:#81c784;--green-dim:#2d5a2e;
  --text:#e8f0e2;--text2:#a8bea0;--text3:#6a8a62;
  --red:#e57373;--amber:#ffc107;--good:#4caf50;
  --r:10px;--r2:14px;--r3:20px;
  --sh:0 4px 24px rgba(0,0,0,.5);--sh2:0 8px 40px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--green-dim);border-radius:2px}

/* ─── TOPBAR ─── */
#topbar{
  background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);
  border-bottom:1px solid var(--border2);
  padding:10px 14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  position:relative;z-index:1000;
  box-shadow:0 2px 20px rgba(0,0,0,.4);
}
#topbar h1{
  font-family:'Playfair Display',serif;
  font-size:.95rem;font-weight:700;white-space:nowrap;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.02em;
}
#sw{position:relative;flex:1;min-width:110px}
#si{
  width:100%;padding:7px 28px 7px 12px;
  border-radius:var(--r3);border:1px solid var(--border2);
  background:rgba(255,255,255,.06);color:var(--text);
  font-size:14px;outline:none;font-family:'DM Sans',sans-serif;
  transition:border-color .2s,background .2s;
}
#si::placeholder{color:var(--text3)}
#si:focus{border-color:var(--gold);background:rgba(255,255,255,.09)}
#cb{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:.8rem;display:none;padding:3px}
.fb{
  padding:5px 11px;border-radius:var(--r3);
  border:1px solid var(--border2);background:transparent;color:var(--text2);
  cursor:pointer;font-size:.65rem;white-space:nowrap;
  transition:all .2s;touch-action:manipulation;font-family:'DM Sans',sans-serif;font-weight:500;
  letter-spacing:.03em;
}
.fb:hover{border-color:var(--gold);color:var(--gold)}
.fb.on{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);
  color:#0d1a12;border-color:transparent;font-weight:600;
  box-shadow:0 2px 12px rgba(200,169,110,.3);
}
#badge{
  background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);
  padding:3px 9px;border-radius:var(--r3);font-size:.63rem;color:var(--green2);
  font-weight:600;white-space:nowrap;
}
#met-st{font-size:.6rem;color:var(--text3);width:100%;text-align:right}

/* ─── DAY TABS ─── */
#dtabs{
  display:flex;gap:5px;padding:7px 12px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;
}
#dtabs::-webkit-scrollbar{display:none}
.dt{
  padding:5px 12px;border-radius:var(--r);
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;font-size:.65rem;white-space:nowrap;
  transition:all .2s;touch-action:manipulation;font-family:'DM Sans',sans-serif;font-weight:500;
}
.dt:hover{border-color:var(--border2);color:var(--text)}
.dt.on{
  background:var(--green-dim);border-color:var(--green);color:var(--green2);
  box-shadow:0 0 12px rgba(76,175,80,.2);
}

/* ─── HOUR BAR ─── */
#hbar{
  padding:7px 12px;
  background:var(--bg2);border-bottom:1px solid var(--border);
}
#hbar h4{font-size:.62rem;color:var(--text3);margin-bottom:5px;font-weight:400;letter-spacing:.02em}
#hgrid{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#hgrid::-webkit-scrollbar{display:none}
.hc{
  min-width:44px;background:rgba(255,255,255,.04);border-radius:8px;
  padding:5px 2px;text-align:center;border:1px solid var(--border);
  cursor:pointer;transition:all .2s;touch-action:manipulation;flex-shrink:0;
}
.hc:hover{border-color:var(--border2);transform:translateY(-1px)}
.hc.sel{background:rgba(200,169,110,.12);border-color:var(--gold);box-shadow:0 0 10px rgba(200,169,110,.2)}
.hc.good{border-color:rgba(76,175,80,.5);background:rgba(76,175,80,.08)}
.hc.warn{border-color:rgba(255,193,7,.5);background:rgba(255,193,7,.07)}
.hc.bad{border-color:rgba(229,115,115,.5);background:rgba(229,115,115,.07)}
.hc .ht{font-size:.55rem;color:var(--text3)}.hc .hi{font-size:.85rem;line-height:1.2}
.hc .htp{font-size:.72rem;font-weight:700;color:var(--gold)}.hc .hw{font-size:.52rem;color:var(--text3)}

/* ─── LAYOUT ─── */
#main{display:flex;flex-direction:column}
#map-wrap{flex:1;position:relative;min-height:0}
#map{width:100%;height:100%}

/* ─── PANEL ─── */
#panel{
  background:var(--surface);
  border-top:1px solid var(--border2);
  display:flex;flex-direction:column;
  transition:height .3s cubic-bezier(.4,0,.2,1);overflow:hidden;
}
#panel-handle{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 14px;cursor:pointer;
  background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 100%);
  border-bottom:1px solid var(--border);
  touch-action:manipulation;
}
#ph{
  font-family:'Playfair Display',serif;
  font-size:.78rem;color:var(--gold);font-weight:600;
}
#panel-toggle{background:none;border:none;color:var(--text3);font-size:.9rem;cursor:pointer;padding:0 3px;transition:transform .3s}
#pb{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}

/* ─── LIST ITEMS ─── */
.bi{
  padding:12px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;touch-action:manipulation;
  position:relative;
}
.bi::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(180deg,var(--gold) 0%,var(--gold2) 100%);
  transition:width .2s;
}
.bi:hover{background:rgba(255,255,255,.03)}
.bi:hover::before{width:2px}
.bi:active{background:rgba(255,255,255,.05)}
.bi.sel{background:rgba(200,169,110,.07)}
.bi.sel::before{width:3px}
.bn{font-weight:600;font-size:.82rem;color:var(--text);margin-bottom:2px;font-family:'DM Sans',sans-serif}
.br{font-size:.67rem;color:var(--gold);margin-bottom:2px;opacity:.85}
.ba{font-size:.65rem;color:var(--text3);margin-bottom:4px}
.bt{display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:2px 7px;border-radius:20px;font-size:.58rem;font-weight:600;letter-spacing:.02em}
.tn{background:rgba(76,175,80,.15);color:#81c784;border:1px solid rgba(76,175,80,.25)}
.ts{background:rgba(255,138,76,.12);color:#ffb74d;border:1px solid rgba(255,138,76,.25)}
.tc{background:rgba(66,165,245,.12);color:#90caf9;border:1px solid rgba(66,165,245,.25)}
.tt{background:rgba(200,169,110,.1);color:var(--gold);border:1px solid rgba(200,169,110,.2)}
.trip{background:rgba(255,193,7,.1);color:#ffd54f;border:1px solid rgba(255,193,7,.3)}
.tv-p{background:rgba(144,202,249,.1);color:#90caf9;border:1px solid rgba(144,202,249,.2)}
.tv-a{background:rgba(240,98,146,.1);color:#f48fb1;border:1px solid rgba(240,98,146,.2)}
.tv-c{background:rgba(206,147,216,.1);color:#ce93d8;border:1px solid rgba(206,147,216,.2)}
.tv-b{background:rgba(128,203,196,.1);color:#80cbc4;border:1px solid rgba(128,203,196,.2)}
.tv-pl{background:rgba(255,213,79,.1);color:#ffd54f;border:1px solid rgba(255,213,79,.2)}
.park-good{background:rgba(76,175,80,.1);color:#81c784;border:1px solid rgba(76,175,80,.25)}
.park-med{background:rgba(255,193,7,.1);color:#ffd54f;border:1px solid rgba(255,193,7,.3)}
.park-bad{background:rgba(229,115,115,.1);color:#ef9a9a;border:1px solid rgba(229,115,115,.25)}
.tw-good{background:rgba(76,175,80,.1);color:#81c784;border:1px solid rgba(76,175,80,.25)}
.tw-warn{background:rgba(255,193,7,.1);color:#ffd54f;border:1px solid rgba(255,193,7,.3)}
.tw-bad{background:rgba(229,115,115,.1);color:#ef9a9a;border:1px solid rgba(229,115,115,.25)}

/* ─── DETAIL ─── */
.bar-detail{padding:14px}
.bar-detail .bn{
  font-family:'Playfair Display',serif;
  font-size:1.05rem;margin-bottom:5px;color:var(--text);font-weight:700;
}
.prec{padding:8px 10px;border-radius:var(--r);font-size:.72rem;margin:8px 0;border-left:3px solid}
.prec.good{background:rgba(76,175,80,.08);border-color:var(--green);color:#a5d6a7}
.prec.warn{background:rgba(255,193,7,.08);border-color:var(--amber);color:#ffe082}
.prec.bad{background:rgba(229,115,115,.08);border-color:var(--red);color:#ef9a9a}
.park-box{padding:8px 10px;border-radius:var(--r);font-size:.72rem;margin:5px 0}
.gmaps-btn{
  display:block;text-align:center;margin-top:10px;padding:10px;
  background:linear-gradient(135deg,var(--green-dim),#1a4020);
  color:var(--green2);border-radius:var(--r2);font-size:.78rem;
  text-decoration:none;font-weight:600;
  border:1px solid rgba(76,175,80,.3);
  transition:all .2s;font-family:'DM Sans',sans-serif;
}
.gmaps-btn:hover{background:linear-gradient(135deg,#1a4020,#1f4a26);border-color:var(--green)}
.trip-btn{
  display:block;text-align:center;margin-top:5px;padding:10px;
  background:rgba(255,193,7,.08);color:#ffd54f;border-radius:var(--r2);
  font-size:.78rem;text-decoration:none;font-weight:600;
  border:1px solid rgba(255,193,7,.3);
  transition:all .2s;font-family:'DM Sans',sans-serif;
}
.trip-btn:hover{background:rgba(255,193,7,.13)}
.back-btn{
  display:flex;align-items:center;gap:5px;color:var(--gold);
  font-size:.73rem;font-weight:600;cursor:pointer;margin-bottom:10px;
  border:none;background:none;padding:0;touch-action:manipulation;
  font-family:'DM Sans',sans-serif;opacity:.8;
  transition:opacity .2s;
}
.back-btn:hover{opacity:1}

/* ─── SECTION HEADERS ─── */
.section-header{
  padding:7px 14px;
  background:var(--bg2);
  font-size:.6rem;font-weight:700;color:var(--text3);
  border-bottom:1px solid var(--border);
  letter-spacing:.1em;text-transform:uppercase;
  font-family:'DM Sans',sans-serif;
}

/* ─── MAP POPUPS ─── */
.leaflet-popup-content-wrapper{
  background:var(--surface)!important;
  border:1px solid var(--border2)!important;
  border-radius:var(--r2)!important;
  box-shadow:var(--sh2)!important;
  color:var(--text)!important;
}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-close-button{color:var(--text3)!important;font-size:16px!important}
.pw{min-width:175px;max-width:220px}
.pn{font-family:'Playfair Display',serif;font-weight:700;font-size:.88rem;color:var(--text);margin-bottom:3px}
.pr{font-size:.68rem;color:var(--gold);margin-bottom:3px}
.pa{font-size:.65rem;color:var(--text3);margin-bottom:4px}
.ptg{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.prec-sm{padding:5px 8px;border-radius:8px;font-size:.68rem;margin-bottom:3px;border-left:2px solid}
.prec-sm.prec.good{border-color:var(--green)}
.prec-sm.prec.warn{border-color:var(--amber)}
.prec-sm.prec.bad{border-color:var(--red)}
.pg{
  display:block;text-align:center;padding:7px;
  background:var(--green-dim);color:var(--green2);
  border-radius:8px;font-size:.68rem;text-decoration:none;font-weight:600;
  margin-top:4px;border:1px solid rgba(76,175,80,.25);
  font-family:'DM Sans',sans-serif;
}

/* ─── MAP ZOOM CONTROLS ─── */
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--text2)!important;border-color:var(--border2)!important}
.leaflet-control-zoom a:hover{background:var(--surface2)!important;color:var(--gold)!important}

/* ─── DESKTOP ─── */
@media(min-width:640px){
  #main{flex-direction:row}
  #map-wrap{flex:1}
  #panel{
    width:320px;border-top:none;
    border-left:1px solid var(--border2);
    height:100%!important;
    background:var(--surface);
  }
  #panel-handle{display:none}
  #pb{height:100%;overflow-y:auto}
}

/* ─── ANIMATIONS ─── */
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bi{animation:fadeSlideIn .2s ease both}
.bar-detail{animation:fadeSlideIn .25s ease both}
</style>
</head>
<body>
<div id="topbar">
  <h1>✦ Terrazas Alcorcón</h1>
  <div id="sw"><input id="si" type="search" placeholder="Buscar local, barrio..." autocomplete="off"><button id="cb" onclick="clr()">✕</button></div>
  <button class="fb on" onclick="sf(this,'all')">Todos</button>
  <button class="fb" onclick="sf(this,'natural')">🌳</button>

</div>
<div id="dtabs"></div>
<div id="hbar">
  <h4>Selecciona una hora para ver meteorología y aparcamiento en tiempo real</h4>

</div>
<div id="main">

      <span id="ph">Selecciona un local</span>
      <button id="panel-toggle">▲</button>
    </div>
    <div id="pb"></div>
  </div>
</div>
<input id="akey" type="hidden"/>
<script>
// ── APARCAMIENTO POR ZONA Y HORA ──────────────────────────────────────────────
function parkInfo(zona,hora){

  const z=D[zona]||D.libre;return m?z.m:t?z.t:z.n;
}

const VIA={p:{i:"🚶",l:"Peatonal",c:"tv-p"},a:{i:"🛣️",l:"Avenida",c:"tv-a"},c:{i:"🏙️",l:"Calle",c:"tv-c"},b:{i:"🌿",l:"Bulevar/Paseo",c:"tv-b"},pl:{i:"🏛️",l:"Plaza",c:"tv-pl"}};

  {n:"Restaurante El Acebo",lat:40.3428,lng:-3.826,r:4.3,rv:3606,a:"Pl. del Sol, 7",p:"+34 914 86 02 32",s:"sombrilla",t:"Gran terraza familiar",h:"Mar-Dom 8-1",pr:"€€",via:"pl",zp:"centro",b:"Casco Antiguo"},

async function loadAEMET(key){if(!key)return;document.getElementById('met-st').textContent='Cargando tiempo...';try{const r1=await fetch(`${BASE}/prediccion/especifica/municipio/horaria/${MUN}?api_key=${key}`);const j1=await r1.json();if(j1.estado!==200)throw new Error();hForecast=parseH(await(await fetch(j1.datos)).json());const r2=await fetch(`${BASE}/prediccion/especifica/municipio/diaria/${MUN}?api_key=${key}`);const j2=await r2.json();dForecast=parseD(await(await fetch(j2.datos)).json());document.getElementById('met-st').textContent='✅ Tiempo cargado';localStorage.setItem('aemet_key',key);buildTabs();renderHours();if(sel!==null)pick(sel);}catch(e){document.getElementById('met-st').textContent='⚠️ Error tiempo';}}
function parseH(data){const r={};(data[0]?.prediccion?.dia||[]).forEach(dia=>{const date=dia.fecha?.substring(0,10);if(!date)return;r[date]=[];const T=dia.temperatura||[],S=dia.estadoCielo||[],W=dia.viento||[],P=dia.precipitacion||[],PR=dia.probPrecipitacion||[];for(let h=0;h<24;h++){const hs=String(h).padStart(2,'0');const temp=T.find(t=>t.periodo===hs)?.value;if(temp===undefined)continue;const probRain=+(PR.find(p=>p.periodo===hs)?.value||PR.find(p=>+p.periodo<=h&&+(p.periodo||0)+6>h)?.value||0);r[date].push({h,temp:+temp,sky:+(S.find(s=>s.periodo===hs)?.value||0),wind:+(W.find(w=>w.periodo===hs)?.velocidad||0),rain:+(P.find(p=>p.periodo===hs)?.value||0),probRain});}});return r;}
function parseD(data){return(data[0]?.prediccion?.dia||[]).map(d=>({date:d.fecha?.substring(0,10),tmax:d.temperatura?.maxima,tmin:d.temperatura?.minima,sky:d.estadoCielo?.[0]?.descripcion||'',skyCode:+(d.estadoCielo?.[0]?.value||0),rain:+(d.probPrecipitacion?.[0]?.value||0)}));}
function skyI(c){if(!c)return'🌤';if(c<=11)return'☀️';if(c<=15)return'⛅';if(c<=17)return'🌥';if(c<=26)return'☁️';if(c<=35)return'🌧';if(c<=46)return'⛈';return'🌩';}
function score(h){if(!h)return{s:'warn',msg:'Sin datos'};const{temp,wind,rain,probRain}=h;if(rain>0.5&&probRain>=20)return{s:'bad',msg:`🌧 Lluvia probable (${probRain}%, ${rain}mm)`};if(rain>2)return{s:'bad',msg:`🌧 Lluvia (${rain}mm)`};if(temp>37)return{s:'bad',msg:`🌡️ Demasiado calor (${temp}°C)`};if(temp<9)return{s:'bad',msg:`🥶 Frío (${temp}°C)`};if(wind>40)return{s:'bad',msg:`💨 Viento fuerte (${wind}km/h)`};if(rain>0||probRain>=20)return{s:'warn',msg:`🌦 Posible lluvia (${probRain}%, ${rain}mm)`};if(temp>33||temp<13)return{s:'warn',msg:`🌡️ Temperatura límite (${temp}°C)`};if(wind>25)return{s:'warn',msg:`💨 Algo de viento (${wind}km/h)`};return{s:'good',msg:`✅ Ideal — ${temp}°C, viento ${wind}km/h`};}
function shadeNote(shade,s,temp){if(shade==='cubierta'&&s==='bad'&&temp<37)return'🏠 Al ser cubierta puede ser viable';if(shade==='natural'&&temp>30)return'🌳 Sombra natural ayuda';if(shade==='sombrilla'&&temp>28)return'⛱️ Sombrilla protege';return'';}
function allDays(){return[...new Set([...Object.keys(hForecast).sort(),...dForecast.map(d=>d.date)])].sort().slice(0,7);}
function selDate(){return allDays()[selDay]||null;}
function buildTabs(){const el=document.getElementById('dtabs');el.innerHTML='';const days=allDays(),names=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];days.forEach((date,i)=>{const d=new Date(date+'T12:00:00'),df=dForecast.find(x=>x.date===date);const btn=document.createElement('div');btn.className='dt'+(i===selDay?' on':'');btn.innerHTML=`${df?skyI(df.skyCode):'📅'} ${names[d.getDay()]} ${d.getDate()}`;btn.onclick=()=>{selDay=i;selHour=null;document.querySelectorAll('.dt').forEach((t,j)=>t.classList.toggle('on',j===i));renderHours();if(sel!==null)pick(sel);};el.appendChild(btn);});}
function renderHours(){const grid=document.getElementById('hgrid'),date=selDate(),hours=hForecast[date];if(!hours||!hours.length){grid.innerHTML='<span style="font-size:.7rem;color:#aaa">Sin datos horarios</span>';return;}grid.innerHTML='';hours.forEach(h=>{const sc=score(h),card=document.createElement('div');card.className=`hc ${sc.s}`;card.innerHTML=`<div class="ht">${String(h.h).padStart(2,'0')}h</div><div class="hi">${skyI(h.sky)}</div><div class="htp">${h.temp}°</div><div class="hw">💨${h.wind}</div>`;card.title=sc.msg;card.onclick=()=>{selHour=h.h;document.querySelectorAll('.hc').forEach(c=>c.classList.remove('sel'));card.classList.add('sel');if(sel!==null)pick(sel);};grid.appendChild(card);});}
function fmtRange(hrs){if(!hrs.length)return'';const g=[];let st=hrs[0].h,pv=hrs[0].h;for(let i=1;i<hrs.length;i++){if(hrs[i].h===pv+1){pv=hrs[i].h;}else{g.push(`${String(st).padStart(2,'0')}-${String(pv+1).padStart(2,'0')}h`);st=hrs[i].h;pv=hrs[i].h;}}g.push(`${String(st).padStart(2,'0')}-${String(pv+1).padStart(2,'0')}h`);return g.join(', ');}

  const curH=selHour!==null?hours.find(h=>h.h===selHour):null;
  const useH=curH||hours[Math.floor(hours.length/2)]||null;
  const hora=selHour??new Date().getHours();
  const byBarrio={};
  vis.forEach(i=>{const br=BARS[i].b||'Otros';if(!byBarrio[br])byBarrio[br]=[];byBarrio[br].push(i);});
  pb.innerHTML=Object.keys(byBarrio).sort().map(br=>{
    const items=byBarrio[br].map(i=>{
      const b=BARS[i],sh=SH[b.s],sc=score(useH),via=VIA[b.via||'c']||VIA.c;
      const pk=parkInfo(b.zp||'libre',hora);
      const wdot=useH?(sc.s==='good'?'🟢':sc.s==='warn'?'🟡':'🔴'):'';
      const pdot=pk.c==='good'?'🟢':pk.c==='med'?'🟡':'🔴';
      return`<div class="bi${sel===i?' sel':''}" data-i="${i}" onclick="pick(${i});openPanel()">
        <div class="bn">${b.n}${b.trip?' <span class="tag trip" style="font-size:.58rem">⭐TA</span>':''}</div>
        <div class="br">${'★'.repeat(Math.round(b.r))} ${b.r} · ${b.rv.toLocaleString()} · ${b.pr}</div>
        <div class="ba">📍 ${b.a}</div>
        <div class="bt">
          <span class="tag ${sh.c}">${sh.i} ${sh.l}</span>
          <span class="tag ${via.c}">${via.i} ${via.l}</span>
          ${useH?`<span class="tag tw-${sc.s}">${wdot} ${useH.temp}°C</span>`:''}
          <span class="tag park-${pk.c}">${pdot} Aparc.</span>
        </div>
      </div>`;
    }).join('');
    return`<div class="section-header">🏘️ ${br} · ${byBarrio[br].length} locales</div>${items}`;
  }).join('');
}

function filt(){
  vis=BARS.map((_,i)=>i).filter(i=>{
    const b=BARS[i];
    if(af==='tripadvisor')return b.trip===true&&(!q||[b.n,b.a,b.b||''].some(x=>x.toLowerCase().includes(q)));
    return(af==='all'||b.s===af)&&(!q||[b.n,b.a,b.s,b.t,b.b||''].some(x=>x.toLowerCase().includes(q)));
  });
  mkrs.forEach((m,i)=>{vis.includes(i)?m.addTo(map):map.removeLayer(m);});
  document.getElementById('badge').textContent=vis.length;
  if(sel===null)render();
}
function sf(btn,shade){document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');af=shade;sel=null;filt();}
function clr(){document.getElementById('si').value='';q='';document.getElementById('cb').style.display='none';sel=null;filt();}
document.getElementById('si').addEventListener('input',function(){q=this.value.toLowerCase().trim();document.getElementById('cb').style.display=q?'inline':'none';sel=null;filt();});

function adjustLayout(){
  const tb=document.getElementById('topbar').offsetHeight+document.getElementById('dtabs').offsetHeight+document.getElementById('hbar').offsetHeight;
  document.getElementById('main').style.height=`calc(100vh - ${tb}px)`;map.invalidateSize();
}
window.addEventListener('resize',adjustLayout);setTimeout(adjustLayout,100);

filt();
const savedKey=localStorage.getItem('aemet_key')||DEFAULT_KEY;
if(savedKey){document.getElementById('akey').value=savedKey;loadAEMET(savedKey);}
else{document.getElementById('dtabs').innerHTML='<span style="font-size:.7rem;color:#689f38;padding:4px">Añade tu API Key de AEMET para ver el tiempo →</span>';document.getElementById('hgrid').innerHTML='<span style="font-size:.7rem;color:#aaa">Sin API Key AEMET</span>';}
</script>
