<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b5e20">
<title>🍺 Terrazas Alcorcón</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5}

/* TOPBAR */
#topbar{background:#1b5e20;color:white;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:1000;-webkit-overflow-scrolling:touch}
#topbar h1{font-size:.9rem;font-weight:700;white-space:nowrap}
#sw{position:relative;flex:1;min-width:120px}
#si{width:100%;padding:8px 28px 8px 10px;border-radius:20px;border:none;font-size:16px;outline:none;-webkit-appearance:none}
#cb{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#555;font-size:.9rem;display:none;padding:4px}
.fb{padding:7px 12px;border-radius:16px;border:2px solid rgba(255,255,255,.4);background:transparent;color:white;cursor:pointer;font-size:.72rem;white-space:nowrap;transition:all .2s;-webkit-appearance:none;touch-action:manipulation}
.fb.on{background:white;color:#1b5e20;border-color:white}
#badge{background:rgba(255,255,255,.2);padding:4px 9px;border-radius:12px;font-size:.7rem;white-space:nowrap}
#met-st{font-size:.65rem;color:rgba(255,255,255,.7);width:100%;text-align:right}

/* DAY TABS */
#dtabs{display:flex;gap:4px;padding:6px 10px;background:#f1f8e9;border-bottom:1px solid #dcedc8;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#dtabs::-webkit-scrollbar{display:none}
.dt{padding:5px 12px;border-radius:14px;background:#dcedc8;border:1px solid #c5e1a5;color:#33691e;cursor:pointer;font-size:.72rem;white-space:nowrap;transition:all .2s;touch-action:manipulation}
.dt.on{background:#1b5e20;border-color:#1b5e20;color:white}

/* HOURLY */
#hbar{padding:7px 10px;background:#f9fbe7;border-bottom:1px solid #dcedc8}
#hbar h4{font-size:.7rem;color:#558b2f;margin-bottom:5px}
#hgrid{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#hgrid::-webkit-scrollbar{display:none}
.hc{min-width:46px;background:white;border-radius:6px;padding:5px 2px;text-align:center;border:1px solid #ddd;cursor:pointer;transition:all .2s;touch-action:manipulation;flex-shrink:0}
.hc.sel{background:#f1f8e9;border-color:#558b2f}
.hc.good{border-color:#4caf50;background:#f1f8e9}
.hc.warn{border-color:#ffa726;background:#fffde7}
.hc.bad{border-color:#ef5350;background:#ffebee}
.hc .ht{font-size:.6rem;color:#888}
.hc .hi{font-size:.9rem}
.hc .htp{font-size:.78rem;font-weight:700;color:#e65100}
.hc .hw{font-size:.58rem;color:#999}

/* LAYOUT PRINCIPAL */
#main{display:flex;flex-direction:column;height:calc(100vh - var(--topbar-h, 100px))}
#map-wrap{flex:1;position:relative;min-height:0}
#map{width:100%;height:100%}

/* PANEL INFERIOR MÓVIL */
#panel{background:white;border-top:3px solid #1b5e20;display:flex;flex-direction:column;transition:height .3s ease;overflow:hidden}
#panel-handle{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;background:#e8f5e9;touch-action:manipulation}
#panel-handle .drag-bar{width:40px;height:4px;background:#aaa;border-radius:2px;margin:0 auto}
#panel-title-bar{display:flex;align-items:center;justify-content:space-between;width:100%}
#ph{font-size:.78rem;color:#1b5e20;font-weight:600}
#panel-toggle{background:none;border:none;color:#1b5e20;font-size:1.1rem;cursor:pointer;padding:0 4px}
#pb{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}

/* LISTA */
.bi{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer;transition:background .15s;touch-action:manipulation}
.bi:active{background:#f1f8e9}
.bi.sel{background:#c8e6c9}
.bn{font-weight:700;font-size:.85rem;color:#111;margin-bottom:2px}
.br{font-size:.72rem;color:#f57c00;margin-bottom:2px}
.ba{font-size:.7rem;color:#666;margin-bottom:4px}
.bt{display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:3px 7px;border-radius:8px;font-size:.65rem;font-weight:600}
.tn{background:#e8f5e9;color:#2e7d32}
.ts{background:#fff3e0;color:#e65100}
.tc{background:#e3f2fd;color:#1565c0}
.tt{background:#f3e5f5;color:#6a1b9a}
.trip{background:#fff8e1;color:#ff6f00;border:1px solid #ffcc02}
.tw-good{background:#e8f5e9;color:#2e7d32;border:1px solid #4caf50}
.tw-warn{background:#fffde7;color:#f57f17;border:1px solid #ffa726}
.tw-bad{background:#ffebee;color:#c62828;border:1px solid #ef5350}

/* DETALLE BAR */
.bar-detail{padding:12px 14px}
.bar-detail .bn{font-size:.95rem;margin-bottom:4px}
.prec{padding:8px 10px;border-radius:8px;font-size:.78rem;margin:8px 0}
.prec.good{background:#e8f5e9;border:1px solid #4caf50;color:#2e7d32}
.prec.warn{background:#fffde7;border:1px solid #ffa726;color:#f57f17}
.prec.bad{background:#ffebee;border:1px solid #ef5350;color:#c62828}
.gmaps-btn{display:block;text-align:center;margin-top:10px;padding:10px;background:#1b5e20;color:white;border-radius:8px;font-size:.82rem;text-decoration:none;font-weight:600}
.trip-btn{display:block;text-align:center;margin-top:6px;padding:10px;background:#ff6f00;color:white;border-radius:8px;font-size:.82rem;text-decoration:none;font-weight:600}
.back-btn{display:flex;align-items:center;gap:6px;color:#1b5e20;font-size:.78rem;font-weight:600;cursor:pointer;margin-bottom:8px;touch-action:manipulation;border:none;background:none;padding:0}

/* POPUP */
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 4px 15px rgba(0,0,0,.15)!important}
.pw{min-width:180px;max-width:220px}
.pn{font-weight:700;font-size:.88rem;color:#1b5e20;margin-bottom:3px}
.pr{font-size:.74rem;color:#f57c00;margin-bottom:3px}
.pa{font-size:.7rem;color:#555;margin-bottom:4px}
.ptg{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.prec-sm{padding:4px 7px;border-radius:5px;font-size:.72rem;margin-bottom:4px}
.pg{display:block;text-align:center;padding:7px;background:#1b5e20;color:white;border-radius:6px;font-size:.72rem;text-decoration:none;font-weight:600;margin-top:4px}

/* DESKTOP */
@media(min-width:640px){
  #main{flex-direction:row}
  #map-wrap{flex:1}
  #panel{width:300px;border-top:none;border-left:3px solid #1b5e20;height:100%!important}
  #panel-handle{display:none}
  #pb{height:100%;overflow-y:auto}
}
</style>
</head>
<body>

<div id="topbar">
  <h1>🍺 Terrazas Alcorcón</h1>
  <div id="sw"><input id="si" type="search" placeholder="🔍 Buscar bar, zona..." autocomplete="off"><button id="cb" onclick="clr()">✕</button></div>
  <button class="fb on" onclick="sf(this,'all')">Todos</button>
  <button class="fb" onclick="sf(this,'natural')">🌳</button>
  <button class="fb" onclick="sf(this,'sombrilla')">⛱️</button>
  <button class="fb" onclick="sf(this,'cubierta')">🏠</button>
  <button class="fb" onclick="sf(this,'tripadvisor')">⭐TA</button>
  <span id="badge">0</span>
  <span id="met-st"></span>
</div>

<div id="dtabs"></div>
<div id="hbar">
  <h4>🕐 Toca una hora para ver la recomendación</h4>
  <div id="hgrid"><span style="font-size:.7rem;color:#aaa">Cargando tiempo...</span></div>
</div>

<div id="main">
  <div id="map-wrap"><div id="map"></div></div>
  <div id="panel" style="height:45vh">
    <div id="panel-handle" onclick="togglePanel()">
      <div id="panel-title-bar">
        <span id="ph">📍 Selecciona un bar</span>
        <button id="panel-toggle">▲</button>
      </div>
    </div>
    <div id="pb"></div>
  </div>
</div>

<input id="akey" type="hidden"/>

async function loadAEMET(key){
  if(!key) return;
  document.getElementById('met-st').textContent='Cargando tiempo...';
  try{
    const r1=await fetch(`${BASE}/prediccion/especifica/municipio/horaria/${MUN}?api_key=${key}`);
    const j1=await r1.json();
    if(j1.estado!==200) throw new Error(j1.descripcion);
    hForecast=parseH(await(await fetch(j1.datos)).json());
    const r2=await fetch(`${BASE}/prediccion/especifica/municipio/diaria/${MUN}?api_key=${key}`);
    const j2=await r2.json();
    dForecast=parseD(await(await fetch(j2.datos)).json());
    document.getElementById('met-st').textContent='✅ Tiempo cargado';
    localStorage.setItem('aemet_key',key);
    buildTabs();renderHours();if(sel!==null)pick(sel);
  }catch(e){document.getElementById('met-st').textContent='⚠️ Error tiempo';}
}

function parseH(data){
  const r={};
  (data[0]?.prediccion?.dia||[]).forEach(dia=>{
    const date=dia.fecha?.substring(0,10);if(!date)return;r[date]=[];
    const T=dia.temperatura||[],S=dia.estadoCielo||[],W=dia.viento||[],P=dia.precipitacion||[],PR=dia.probPrecipitacion||[];
    for(let h=0;h<24;h++){
      const hs=String(h).padStart(2,'0');
      const temp=T.find(t=>t.periodo===hs)?.value;if(temp===undefined)continue;
      const probRain=+(PR.find(p=>p.periodo===hs)?.value||PR.find(p=>+p.periodo<=h&&+(p.periodo||0)+6>h)?.value||0);
      r[date].push({h,temp:+temp,sky:+(S.find(s=>s.periodo===hs)?.value||0),wind:+(W.find(w=>w.periodo===hs)?.velocidad||0),rain:+(P.find(p=>p.periodo===hs)?.value||0),probRain});
    }
  });return r;
}
function parseD(data){return(data[0]?.prediccion?.dia||[]).map(d=>({date:d.fecha?.substring(0,10),tmax:d.temperatura?.maxima,tmin:d.temperatura?.minima,sky:d.estadoCielo?.[0]?.descripcion||'',skyCode:+(d.estadoCielo?.[0]?.value||0),rain:+(d.probPrecipitacion?.[0]?.value||0)}));}
function skyI(c){if(!c)return'🌤';if(c<=11)return'☀️';if(c<=15)return'⛅';if(c<=17)return'🌥';if(c<=26)return'☁️';if(c<=35)return'🌧';if(c<=46)return'⛈';return'🌩';}

function score(h){
  if(!h)return{s:'warn',msg:'Sin datos'};
  const{temp,wind,rain,probRain}=h;
  if(rain>0.5&&probRain>=20)return{s:'bad',msg:`🌧 Lluvia probable (${probRain}%, ${rain}mm)`};
  if(rain>2)return{s:'bad',msg:`🌧 Lluvia (${rain}mm)`};
  if(temp>37)return{s:'bad',msg:`🌡️ Demasiado calor (${temp}°C)`};
  if(temp<9)return{s:'bad',msg:`🥶 Demasiado frío (${temp}°C)`};
  if(wind>40)return{s:'bad',msg:`💨 Viento fuerte (${wind}km/h)`};
  if(rain>0||probRain>=20)return{s:'warn',msg:`🌦 Posible lluvia (${probRain}%, ${rain}mm)`};
  if(temp>33||temp<13)return{s:'warn',msg:`🌡️ Temperatura límite (${temp}°C)`};
  if(wind>25)return{s:'warn',msg:`💨 Algo de viento (${wind}km/h)`};
  return{s:'good',msg:`✅ Ideal — ${temp}°C, viento ${wind}km/h`};
}
function shadeNote(shade,s,temp){
  if(shade==='cubierta'&&s==='bad'&&temp<37)return'🏠 Al ser cubierta puede ser viable';
  if(shade==='natural'&&temp>30)return'🌳 Sombra natural ayuda con el calor';
  if(shade==='sombrilla'&&temp>28)return'⛱️ Sombrilla protege del sol';
  return'';
}
function allDays(){return[...new Set([...Object.keys(hForecast).sort(),...dForecast.map(d=>d.date)])].sort().slice(0,7);}
function selDate(){return allDays()[selDay]||null;}

function buildTabs(){
  const el=document.getElementById('dtabs');el.innerHTML='';
  const days=allDays(),names=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  days.forEach((date,i)=>{
    const d=new Date(date+'T12:00:00'),df=dForecast.find(x=>x.date===date);
    const btn=document.createElement('div');
    btn.className='dt'+(i===selDay?' on':'');
    btn.innerHTML=`${df?skyI(df.skyCode):'📅'} ${names[d.getDay()]} ${d.getDate()}`;
    btn.onclick=()=>{selDay=i;selHour=null;document.querySelectorAll('.dt').forEach((t,j)=>t.classList.toggle('on',j===i));renderHours();if(sel!==null)pick(sel);};
    el.appendChild(btn);
  });
}

function renderHours(){
  const grid=document.getElementById('hgrid'),date=selDate(),hours=hForecast[date];
  if(!hours||!hours.length){grid.innerHTML='<span style="font-size:.7rem;color:#aaa">Sin datos horarios</span>';return;}
  grid.innerHTML='';
  hours.forEach(h=>{
    const sc=score(h),card=document.createElement('div');
    card.className=`hc ${sc.s}`;
    card.innerHTML=`<div class="ht">${String(h.h).padStart(2,'0')}h</div><div class="hi">${skyI(h.sky)}</div><div class="htp">${h.temp}°</div><div class="hw">💨${h.wind}</div>`;
    card.title=sc.msg;
    card.onclick=()=>{selHour=h.h;document.querySelectorAll('.hc').forEach(c=>c.classList.remove('sel'));card.classList.add('sel');if(sel!==null)pick(sel);};
    grid.appendChild(card);
  });
}

function fmtRange(hrs){
  if(!hrs.length)return'';
  const g=[];let st=hrs[0].h,pv=hrs[0].h;
  for(let i=1;i<hrs.length;i++){if(hrs[i].h===pv+1){pv=hrs[i].h;}else{g.push(`${String(st).padStart(2,'0')}-${String(pv+1).padStart(2,'0')}h`);st=hrs[i].h;pv=hrs[i].h;}}
  g.push(`${String(st).padStart(2,'0')}-${String(pv+1).padStart(2,'0')}h`);
  return g.join(', ');
}

        <span class="tag tt">🪑 ${bar.t}</span>
      </div>
      ${evalH?`
      <div class="prec ${sc.s}">
        <strong>${selHour!==null?String(selHour).padStart(2,'0')+'h — ':''}${sc.msg}</strong>
        ${sn?`<div style="font-size:.72rem;margin-top:3px">${sn}</div>`:''}
      </div>
      ${goodH.length?`<div style="font-size:.72rem;color:#2e7d32;margin-top:4px">✅ Mejor franja: ${fmtRange(goodH)}</div>`:''}
      ${!goodH.length&&warnH.length?`<div style="font-size:.72rem;color:#f57f17;margin-top:4px">⚠️ Aceptable: ${fmtRange(warnH)}</div>`:''}
      `:`<div class="prec warn">Carga la API AEMET para ver recomendación meteorológica</div>`}
      ${df?`<div style="font-size:.7rem;color:#666;margin-top:5px">📊 ${df.tmin}°-${df.tmax}° · ${df.sky} · 🌧${df.rain}%</div>`:''}
      <a href="${gm}" target="_blank" class="gmaps-btn">📍 Ver en Google Maps</a>
      ${bar.trip&&bar.tripUrl?`<a href="${bar.tripUrl}" target="_blank" class="trip-btn">⭐ Ver en TripAdvisor</a>`:''}
    </div>`;

  const sh2=SH[bar.s];
  mkrs[i].bindPopup(`<div class="pw">
    <div class="pn">${bar.n}${bar.trip?' ⭐':''}</div>
    <div class="pr">${'★'.repeat(Math.round(bar.r))} ${bar.r} · ${bar.rv.toLocaleString()} · ${bar.pr}</div>
    <div class="pa">📍 ${bar.a}${bar.p?' · 📞 '+bar.p:''}</div>
    <div class="ptg"><span class="tag ${sh2.c}">${sh2.i} ${sh2.l}</span><span class="tag tt">🪑 ${bar.t}</span>${bar.trip?'<span class="tag trip">⭐ TripAdvisor</span>':''}</div>
    ${evalH?`<div class="prec-sm prec ${sc.s}">${sc.msg}</div>`:''}
    ${goodH.length?`<div style="font-size:.68rem;color:#2e7d32">✅ ${fmtRange(goodH)}</div>`:''}
    <div style="font-size:.68rem;color:#555;margin-top:3px">🕐 ${bar.h}</div>
    <a class="pg" href="${gm}" target="_blank">📍 Ver en Google Maps</a>
    ${bar.trip&&bar.tripUrl?`<a class="pg" style="background:#ff6f00;margin-top:4px" href="${bar.tripUrl}" target="_blank">⭐ TripAdvisor</a>`:''}
  </div>`,{maxWidth:240}).openPopup();
  map.setView([bar.lat,bar.lng],15);
  const el=document.querySelector(`.bi[data-i="${i}"]`);
  if(el) el.scrollIntoView({block:'nearest'});
}

function showList(){
  sel=null;
  render();
  document.getElementById('ph').textContent=`${vis.length} terraza${vis.length!==1?'s':''}`;
}

function render(){
  const pb=document.getElementById('pb');
  if(sel!==null){pick(sel);return;}
  document.getElementById('ph').textContent=`${vis.length} terraza${vis.length!==1?'s':''}`;
  const date=selDate(),hours=hForecast[date]||[],evalH=hours[Math.floor(hours.length/2)]||null;
  pb.innerHTML=vis.map(i=>{
    const b=BARS[i],sh=SH[b.s],sc=score(evalH);
    const dot=sc.s==='good'?'🟢':sc.s==='warn'?'🟡':'🔴';
    return`<div class="bi${sel===i?' sel':''}" data-i="${i}" onclick="pick(${i});openPanel()">
      <div class="bn">${b.n}${b.trip?' <span class="tag trip" style="font-size:.6rem">⭐ TA</span>':''}</div>
      <div class="br">${'★'.repeat(Math.round(b.r))} ${b.r} · ${b.rv.toLocaleString()} · ${b.pr}</div>
      <div class="ba">📍 ${b.a}</div>
      <div class="bt">
        <span class="tag ${sh.c}">${sh.i} ${sh.l}</span>
        <span class="tag tt">🪑 ${b.t}</span>
        ${evalH?`<span class="tag tw-${sc.s}">${dot} ${evalH.temp}°C</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function filt(){
  vis=BARS.map((_,i)=>i).filter(i=>{
    const b=BARS[i];
    if(af==='tripadvisor') return b.trip===true && (!q||[b.n,b.a,b.s,b.t].some(x=>x.toLowerCase().includes(q)));
    return(af==='all'||b.s===af)&&(!q||[b.n,b.a,b.s,b.t].some(x=>x.toLowerCase().includes(q)));
  });
  mkrs.forEach((m,i)=>{vis.includes(i)?m.addTo(map):map.removeLayer(m);});
  document.getElementById('badge').textContent=`${vis.length}`;
  if(sel===null)render();
}

function sf(btn,shade){document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');af=shade;sel=null;filt();}
function clr(){document.getElementById('si').value='';q='';document.getElementById('cb').style.display='none';sel=null;filt();}
document.getElementById('si').addEventListener('input',function(){
  q=this.value.toLowerCase().trim();
  document.getElementById('cb').style.display=q?'inline':'none';
  sel=null;filt();
});

function adjustLayout(){
  const tb=document.getElementById('topbar').offsetHeight;
  const dt=document.getElementById('dtabs').offsetHeight;
  const hb=document.getElementById('hbar').offsetHeight;
  const used=tb+dt+hb;
  document.getElementById('main').style.height=`calc(100vh - ${used}px)`;
  map.invalidateSize();
}
window.addEventListener('resize',adjustLayout);
setTimeout(adjustLayout,100);

filt();
const savedKey=localStorage.getItem('aemet_key')||DEFAULT_KEY;
if(savedKey){document.getElementById('akey').value=savedKey;loadAEMET(savedKey);}
else{
  document.getElementById('dtabs').innerHTML='<span style="font-size:.7rem;color:#689f38;padding:4px">Añade tu API Key de AEMET para ver el tiempo →</span>';
  document.getElementById('hgrid').innerHTML='<span style="font-size:.7rem;color:#aaa">Sin API Key de AEMET</span>';
}
</script>
</body>
</html>
