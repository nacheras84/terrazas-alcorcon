<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍺 Terrazas Alcorcón</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* TOPBAR */
#topbar{background:#1b5e20;color:white;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#topbar h1{font-size:.9rem;font-weight:700;white-space:nowrap}
#sw{position:relative;flex:1;min-width:140px}
#si{width:100%;padding:5px 26px 5px 9px;border-radius:20px;border:none;font-size:.76rem;outline:none}
#cb{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#555;font-size:.8rem;display:none}
.fb{padding:4px 9px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:transparent;color:white;cursor:pointer;font-size:.68rem;white-space:nowrap;transition:all .2s}
.fb.on{background:white;color:#1b5e20;border-color:white}
#badge{background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;font-size:.68rem;white-space:nowrap}

/* AEMET BAR */
#abar{background:#2e7d32;padding:6px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #1b5e20}
#abar input{flex:1;min-width:160px;padding:5px 9px;border-radius:6px;border:none;font-size:.73rem;outline:none}
#abar button{padding:5px 11px;background:#ffa000;border:none;border-radius:6px;color:white;cursor:pointer;font-size:.73rem;font-weight:600;white-space:nowrap}
#abar button:hover{background:#ff8f00}
#abar a{font-size:.68rem;color:#c8e6c9;white-space:nowrap}
#met-status{font-size:.68rem;color:#c8e6c9}

/* DAY TABS */
#dtabs{display:flex;gap:4px;padding:5px 10px;background:#f1f8e9;border-bottom:1px solid #dcedc8;overflow-x:auto}
.dt{padding:4px 11px;border-radius:14px;background:#dcedc8;border:1px solid #c5e1a5;color:#33691e;cursor:pointer;font-size:.72rem;white-space:nowrap;transition:all .2s}
.dt.on{background:#1b5e20;border-color:#1b5e20;color:white}

/* HOURLY */
#hbar{padding:7px 10px;background:#f9fbe7;border-bottom:1px solid #dcedc8}
#hbar h4{font-size:.7rem;color:#558b2f;margin-bottom:5px}
#hgrid{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.hc{min-width:44px;background:white;border-radius:6px;padding:4px 2px;text-align:center;border:1px solid #ddd;cursor:pointer;transition:all .2s}
.hc:hover,.hc.sel{background:#f1f8e9;border-color:#558b2f}
.hc.good{border-color:#4caf50;background:#f1f8e9}
.hc.warn{border-color:#ffa726;background:#fffde7}
.hc.bad{border-color:#ef5350;background:#ffebee}
.hc .ht{font-size:.6rem;color:#888}
.hc .hi{font-size:.9rem}
.hc .htp{font-size:.78rem;font-weight:700;color:#e65100}
.hc .hw{font-size:.58rem;color:#999}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden}
#map{flex:1;min-height:0}
#panel{width:275px;background:white;border-left:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden}
#ph{padding:7px 11px;background:#e8f5e9;border-bottom:1px solid #c8e6c9;font-size:.73rem;color:#1b5e20;font-weight:600}
#pb{flex:1;overflow-y:auto}

/* LISTA */
.bi{padding:9px 11px;border-bottom:1px solid #eee;cursor:pointer;transition:background .15s}
.bi:hover{background:#f1f8e9}
.bi.sel{background:#c8e6c9}
.bn{font-weight:700;font-size:.8rem;color:#111;margin-bottom:2px}
.br{font-size:.68rem;color:#f57c00;margin-bottom:2px}
.ba{font-size:.68rem;color:#666;margin-bottom:3px}
.bt{display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:2px 6px;border-radius:7px;font-size:.62rem;font-weight:600}
.tn{background:#e8f5e9;color:#2e7d32}
.ts{background:#fff3e0;color:#e65100}
.tc{background:#e3f2fd;color:#1565c0}
.tt{background:#f3e5f5;color:#6a1b9a}
.tw-good{background:#e8f5e9;color:#2e7d32;border:1px solid #4caf50}
.tw-warn{background:#fffde7;color:#f57f17;border:1px solid #ffa726}
.tw-bad{background:#ffebee;color:#c62828;border:1px solid #ef5350}

/* POPUP */
.pw{min-width:210px;max-width:245px}
.pn{font-weight:700;font-size:.88rem;color:#1b5e20;margin-bottom:3px}
.pr{font-size:.74rem;color:#f57c00;margin-bottom:3px}
.pa{font-size:.71rem;color:#555;margin-bottom:5px}
.ptg{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.ph2{font-size:.68rem;color:#555;margin-bottom:5px;line-height:1.5}
.prec{padding:5px 8px;border-radius:6px;font-size:.72rem;margin-bottom:5px}
.prec.good{background:#e8f5e9;border:1px solid #4caf50;color:#2e7d32}
.prec.warn{background:#fffde7;border:1px solid #ffa726;color:#f57f17}
.prec.bad{background:#ffebee;border:1px solid #ef5350;color:#c62828}
.pg{display:inline-block;margin-top:3px;padding:5px 11px;background:#1b5e20;color:white;border-radius:6px;font-size:.71rem;text-decoration:none}
.pg:hover{background:#145214}

/* STATUS */
#sbar{background:#f1f8e9;padding:2px 10px;font-size:.65rem;color:#558b2f;border-top:1px solid #dcedc8}

@media(max-width:600px){
  #panel{width:100%;max-height:38vh;border-left:none;border-top:1px solid #ddd}
  #main{flex-direction:column}
}
</style>
</head>

<div id="topbar">
  <h1>🍺 Terrazas Alcorcón</h1>
  <div id="sw"><input id="si" type="text" placeholder="🔍 Buscar..."><button id="cb" onclick="clr()">✕</button></div>
  <button class="fb on" onclick="sf(this,'all')">Todos</button>
  <button class="fb" onclick="sf(this,'natural')">🌳</button>
  <button class="fb" onclick="sf(this,'sombrilla')">⛱️</button>
  <button class="fb" onclick="sf(this,'cubierta')">🏠</button>
  <span id="badge">0</span>
</div>

<div id="abar">
  <input id="akey" type="text" placeholder="🔑 API Key de AEMET (gratis en opendata.aemet.es)"/>
  <button onclick="loadAEMET()">🌤 Ver el tiempo</button>
  <span id="met-status">Sin datos de tiempo</span>
</div>

<div id="dtabs"><span style="font-size:.7rem;color:#689f38;padding:4px">Carga la API Key para ver predicción por días →</span></div>

<div id="hbar">

</div>

<div id="main">

  <div id="panel">

    <div id="pb"></div>
  </div>
</div>
<div id="sbar"><span id="bc">0</span> terrazas · Tiempo: <span id="ms2">introduce API Key de AEMET arriba</span></div>

const SH={natural:{i:"🌳",l:"Sombra natural",c:"tn",col:"#2e7d32"},sombrilla:{i:"⛱️",l:"Sombrilla",c:"ts",col:"#bf360c"},cubierta:{i:"🏠",l:"Cubierta",c:"tc",col:"#1565c0"}};
const MUN="28007", BASE="https://opendata.aemet.es/opendata/api";
let map,mkrs=[],vis=[...Array(BARS.length).keys()],af="all",q="",sel=null;
let hForecast={},dForecast=[],selDay=0,selHour=null;

// ── MAPA ──────────────────────────────────────────────────────────────────────
map=L.map('map').setView([40.347,-3.825],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(map);

BARS.forEach((b,i)=>{
  const sh=SH[b.s];
  const ic=L.divIcon({className:'',html:`<div style="background:${sh.col};color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.3);cursor:pointer">${sh.i}</div>`,iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-13]});

});

lg.addTo(map);

// ── AEMET ─────────────────────────────────────────────────────────────────────
async function loadAEMET(){
  const key=document.getElementById('akey').value.trim();
  if(!key){alert('Introduce tu API Key de AEMET\nGratis en: opendata.aemet.es → Obtención de API Key');return;}
  localStorage.setItem('aemet_key',key);
  setStatus('Cargando...');
  try{
    const r1=await fetch(`${BASE}/prediccion/especifica/municipio/horaria/${MUN}?api_key=${key}`);
    const j1=await r1.json();
    if(j1.estado!==200) throw new Error(j1.descripcion||'Error AEMET');
    hForecast=parseH(await (await fetch(j1.datos)).json());
    const r2=await fetch(`${BASE}/prediccion/especifica/municipio/diaria/${MUN}?api_key=${key}`);
    const j2=await r2.json();
    dForecast=parseD(await (await fetch(j2.datos)).json());
    setStatus('✅ AEMET cargado');
    buildTabs(); renderHours(); if(sel!==null) pick(sel);
  }catch(e){setStatus('❌ '+e.message);}
}

function setStatus(t){document.getElementById('met-status').textContent=t;document.getElementById('ms2').textContent=t;}

function parseH(data){
  const r={};
  (data[0]?.prediccion?.dia||[]).forEach(dia=>{
    const date=dia.fecha?.substring(0,10); if(!date) return; r[date]=[];
    const T=dia.temperatura||[],S=dia.estadoCielo||[],W=dia.viento||[],P=dia.precipitacion||[];
    for(let h=0;h<24;h++){
      const hs=String(h).padStart(2,'0');
      const temp=T.find(t=>t.periodo===hs)?.value;
      if(temp===undefined) continue;
      const probRainVal=+(dia.probPrecipitacion?.find(p=>p.periodo===hs)?.value||dia.probPrecipitacion?.find(p=>+p.periodo<=h&&+(p.periodo||0)+6>h)?.value||0);
      r[date].push({h,temp:+temp,sky:+(S.find(s=>s.periodo===hs)?.value||0),wind:+(W.find(w=>w.periodo===hs)?.velocidad||W.find(w=>w.periodo===hs)?.value||0),rain:+(P.find(p=>p.periodo===hs)?.value||0),probRain:probRainVal});
    }
  }); return r;
}
function parseD(data){return(data[0]?.prediccion?.dia||[]).map(d=>({date:d.fecha?.substring(0,10),tmax:d.temperatura?.maxima,tmin:d.temperatura?.minima,sky:d.estadoCielo?.[0]?.descripcion||'',skyCode:+(d.estadoCielo?.[0]?.value||0),rain:+(d.probPrecipitacion?.[0]?.value||0)}));}

function skyI(c){if(!c)return'🌤';if(c<=11)return'☀️';if(c<=15)return'⛅';if(c<=17)return'🌥';if(c<=26)return'☁️';if(c<=35)return'🌧';if(c<=46)return'⛈';return'🌩';}

function score(h){
  if(!h) return{s:'warn',msg:'Sin datos'};
  const{temp,wind,rain,probRain}=h;
  // Lluvia segura o intensa → malo
  if(rain>0.5 && probRain>=20) return{s:'bad', msg:`🌧 Lluvia probable (${probRain}%, ${rain}mm) — No recomendable`};
  if(rain>2)  return{s:'bad', msg:`🌧 Lluvia (${rain}mm) — No recomendable`};
  if(temp>37) return{s:'bad', msg:`🌡️ Demasiado calor (${temp}°C)`};
  if(temp<9)  return{s:'bad', msg:`🥶 Demasiado frío (${temp}°C)`};
  if(wind>40) return{s:'bad', msg:`💨 Viento fuerte (${wind}km/h)`};
  // Lluvia posible pero leve → precaución
  if(rain>0 || probRain>=20) return{s:'warn',msg:`🌦 Algo de lluvia posible (${probRain||0}%, ${rain}mm) — Con precaución`};
  if(temp>33||temp<13) return{s:'warn',msg:`🌡️ Temperatura límite (${temp}°C)`};
  if(wind>25) return{s:'warn',msg:`💨 Algo de viento (${wind}km/h)`};
  return{s:'good',msg:`✅ Ideal — ${temp}°C, viento ${wind}km/h`};
}

function shadeNote(shade,s,temp){
  if(shade==='cubierta'&&s==='bad'&&temp<37) return'🏠 Al ser cubierta puede ser viable';
  if(shade==='natural'&&temp>30) return'🌳 Sombra natural ayuda con el calor';
  if(shade==='sombrilla'&&temp>28) return'⛱️ Sombrilla protege del sol directo';
  return'';
}

function allDays(){return[...new Set([...Object.keys(hForecast).sort(),...dForecast.map(d=>d.date)])].sort().slice(0,7);}
function selDate(){return allDays()[selDay]||null;}

function buildTabs(){
  const el=document.getElementById('dtabs'); el.innerHTML='';
  const days=allDays(),names=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  days.forEach((date,i)=>{
    const d=new Date(date+'T12:00:00'),df=dForecast.find(x=>x.date===date);
    const btn=document.createElement('div');
    btn.className='dt'+(i===selDay?' on':'');
    btn.innerHTML=`${df?skyI(df.skyCode):'📅'} ${names[d.getDay()]} ${d.getDate()}`;
    if(df) btn.title=`${df.tmin}°-${df.tmax}° · ${df.sky}`;
    btn.onclick=()=>{selDay=i;selHour=null;document.querySelectorAll('.dt').forEach((t,j)=>t.classList.toggle('on',j===i));renderHours();if(sel!==null)pick(sel);};
    el.appendChild(btn);
  });
}

function renderHours(){
  const grid=document.getElementById('hgrid'),date=selDate(),hours=hForecast[date];
  if(!hours||!hours.length){grid.innerHTML='<span style="font-size:.7rem;color:#aaa">Sin predicción horaria para este día</span>';return;}
  grid.innerHTML='';
  hours.forEach(h=>{
    const sc=score(h),card=document.createElement('div');
    card.className=`hc ${sc.s}`;
    card.innerHTML=`<div class="ht">${String(h.h).padStart(2,'0')}h</div><div class="hi">${skyI(h.sky)}</div><div class="htp">${h.temp}°</div><div class="hw">💨${h.wind}</div>`;
    card.title=sc.msg;
    card.onclick=()=>{selHour=h.h;document.querySelectorAll('.hc').forEach(c=>c.classList.remove('sel'));card.classList.add('sel');if(sel!==null)pick(sel);};
    grid.appendChild(card);
  });
}

function fmtRange(hrs){
  if(!hrs.length)return'';
  const g=[];let st=hrs[0].h,pv=hrs[0].h;
  for(let i=1;i<hrs.length;i++){if(hrs[i].h===pv+1){pv=hrs[i].h;}else{g.push(`${String(st).padStart(2,'0')}-${String(pv+1).padStart(2,'0')}h`);st=hrs[i].h;pv=hrs[i].h;}}
  g.push(`${String(st).padStart(2,'0')}-${String(pv+1).padStart(2,'0')}h`);
  return g.join(', ');
}

// ── PANEL ─────────────────────────────────────────────────────────────────────
function pick(i){
  sel=i;
  document.querySelectorAll('.bi').forEach(e=>e.classList.toggle('sel',+e.dataset.i===i));
  const bar=BARS[i],sh=SH[bar.s];
  const date=selDate(),hours=hForecast[date]||[],df=dForecast.find(d=>d.date===date);
  const curH=selHour!==null?hours.find(h=>h.h===selHour):null;
  const evalH=curH||hours[Math.floor(hours.length/2)]||null;
  const sc=score(evalH),sn=evalH?shadeNote(bar.s,sc.s,evalH.temp):'';
  const goodH=hours.filter(h=>score(h).s==='good');
  const warnH=hours.filter(h=>score(h).s==='warn');
  const gm=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(bar.n+' '+bar.a+' Alcorcón')}`;

  document.getElementById('pt').textContent=bar.n;
  document.getElementById('pb').innerHTML=`
    <div style="padding:10px 11px">
      <div style="font-weight:700;font-size:.88rem;margin-bottom:3px">${bar.n}</div>
      <div style="font-size:.72rem;color:#f57c00;margin-bottom:3px">${'★'.repeat(Math.round(bar.r))} ${bar.r} · ${bar.rv.toLocaleString()} reseñas · ${bar.pr}</div>
      <div style="font-size:.7rem;color:#555;margin-bottom:3px">📍 ${bar.a}${bar.p?' · 📞 '+bar.p:''}</div>
      <div style="font-size:.68rem;color:#555;margin-bottom:7px">🕐 ${bar.h}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">
        <span class="tag ${sh.c}">${sh.i} ${sh.l}</span>
        <span class="tag tt">🪑 ${bar.t}</span>
      </div>
      ${evalH?`
      <div class="prec ${sc.s}">
        <strong>${selHour!==null?String(selHour).padStart(2,'0')+'h — ':''}${sc.msg}</strong>
        ${sn?`<div style="font-size:.68rem;margin-top:2px">${sn}</div>`:''}
      </div>
      ${goodH.length?`<div style="font-size:.7rem;color:#2e7d32;margin-top:4px">✅ Mejor franja: ${fmtRange(goodH)}</div>`:''}
      ${!goodH.length&&warnH.length?`<div style="font-size:.7rem;color:#f57f17;margin-top:4px">⚠️ Franja aceptable: ${fmtRange(warnH)}</div>`:''}
      `:`<div class="prec warn" style="margin-top:4px">Introduce la API Key de AEMET para ver recomendación</div>`}
      ${df?`<div style="font-size:.68rem;color:#666;margin-top:5px">📊 Día: ${df.tmin}°-${df.tmax}° · ${df.sky} · 🌧${df.rain}%</div>`:''}
      <a href="${gm}" target="_blank" style="display:inline-block;margin-top:10px;padding:5px 12px;background:#1b5e20;color:white;border-radius:6px;font-size:.72rem;text-decoration:none">Ver en Google Maps →</a>
    </div>`;

  // popup mapa
  const popHtml=`<div class="pw">
    <div class="pn">${bar.n}</div>
    <div class="pr">${'★'.repeat(Math.round(bar.r))} ${bar.r} · ${bar.rv.toLocaleString()} · ${bar.pr}</div>
    <div class="pa">📍 ${bar.a}${bar.p?' · 📞 '+bar.p:''}</div>
    <div class="ptg"><span class="tag ${sh.c}">${sh.i} ${sh.l}</span><span class="tag tt">🪑 ${bar.t}</span></div>
    ${evalH?`<div class="prec ${sc.s}" style="margin-bottom:4px">${sc.msg}${sn?'<br><small>'+sn+'</small>':''}</div>`:''}
    ${goodH.length?`<div style="font-size:.68rem;color:#2e7d32">✅ ${fmtRange(goodH)}</div>`:''}
    <div class="ph2">🕐 ${bar.h}</div>
    <a class="pg" href="${gm}" target="_blank">Ver en Google Maps →</a>
  </div>`;
  mkrs[i].bindPopup(popHtml,{maxWidth:250}).openPopup();
  map.setView([bar.lat,bar.lng],16);
  const el=document.querySelector(`.bi[data-i="${i}"]`);
  if(el) el.scrollIntoView({block:'nearest'});
}

// ── LISTA Y FILTROS ───────────────────────────────────────────────────────────
function render(){
  const pb=document.getElementById('pb');
  if(sel!==null){pick(sel);return;}
  if(!vis.length){pb.innerHTML='<div style="padding:16px;text-align:center;color:#999;font-size:.8rem">Sin resultados</div>';return;}
  document.getElementById('pt').textContent=`${vis.length} terraza${vis.length!==1?'s':''}`;
  const date=selDate(),hours=hForecast[date]||[],evalH=hours[Math.floor(hours.length/2)]||null;
  pb.innerHTML=vis.map(i=>{
    const b=BARS[i],sh=SH[b.s],sc=score(evalH);
    const dot=sc.s==='good'?'🟢':sc.s==='warn'?'🟡':'🔴';
    return`<div class="bi${sel===i?' sel':''}" data-i="${i}" onclick="pick(${i})">
      <div class="bn">${b.n}</div>
      <div class="br">${'★'.repeat(Math.round(b.r))} ${b.r} · ${b.rv.toLocaleString()} · ${b.pr}</div>
      <div class="ba">📍 ${b.a}</div>
      <div class="bt">
        <span class="tag ${sh.c}">${sh.i} ${sh.l}</span>
        <span class="tag tt">🪑 ${b.t}</span>
        ${evalH?`<span class="tag tw-${sc.s}">${dot} ${evalH.temp}°C</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function filt(){
  vis=BARS.map((_,i)=>i).filter(i=>{const b=BARS[i];return(af==='all'||b.s===af)&&(!q||[b.n,b.a,b.s,b.t].some(x=>x.toLowerCase().includes(q)));});
  mkrs.forEach((m,i)=>{vis.includes(i)?m.addTo(map):map.removeLayer(m);});
  document.getElementById('badge').textContent=`${vis.length}`;
  document.getElementById('bc').textContent=vis.length;
  if(sel===null) render();
}

function sf(btn,shade){document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');af=shade;sel=null;filt();}
function clr(){document.getElementById('si').value='';q='';document.getElementById('cb').style.display='none';filt();}
document.getElementById('si').addEventListener('input',function(){q=this.value.toLowerCase().trim();document.getElementById('cb').style.display=q?'inline':'none';sel=null;filt();});
